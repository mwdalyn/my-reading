name: Validate reading log database

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: reading-db-sync
  cancel-in-progress: false

jobs:
  validate-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          
      - name: Validate database and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: .
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          for i in {1..5}; do
            echo "Attempt $i"

            # Get the latest DB state before validating
            git fetch origin
            git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)"

            # Re-run validation against the freshest state
            python scripts/validate.py

            git add data/reading.sqlite

            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
              break
            fi

            git commit -m "Update reading DB"

            if git push origin HEAD; then
              echo "Push succeeded"
              break
            else
              echo "Push failed, retrying..."
              sleep 2
            fi
          done

      - name: Upload validation report from validate.py
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: data/validation_report.md
