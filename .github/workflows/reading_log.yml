name: Update reading log

permissions: 
  contents: write
  issues: read

on:
  issues:
    types: [opened, edited, closed, labeled]
  issue_comment:
    types: [created, edited]

concurrency:
  group: reading-db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: > 
      github.event.issue &&
      contains(github.event.issue.labels.*.name, 'reading')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # TODO: Update this

      - name: Clear pip cache (debug)
        run: |
          pip cache purge

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Upload GitHub payload debug
        uses: actions/upload-artifact@v4
        with:
          name: github-payload
          path: debug/

      - name: Sync reading data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }} # May need for other workflows
          # WIKI_USER_AGENT: ${{ secrets.WIKI_USER_AGENT }} # May need for other workflows
          PYTHONPATH: .
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          for i in {1..5}; do
            echo "Attempt $i"

            # Get the latest DB state before syncing
            git fetch origin
            git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)"

            # Regenerate the DB against the freshest state
            python scripts/sync.py

            git add data/reading.sqlite

            if git diff-index --quiet HEAD --; then
              echo "No changes to commit"
              break
            fi

            git commit -m "Update reading DB"

            if git push origin HEAD; then
              echo "Push succeeded"
              break
            else
              echo "Push failed, retrying..."
              sleep 2
            fi
          done